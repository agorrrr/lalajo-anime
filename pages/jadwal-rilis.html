<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Rilis - Lalajo Anime</title>
  <link rel="stylesheet" href="../assets/css/font-awesome.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<script src="../assets/js/layout.js"></script>
<main id="content">
  <div class="page-title-bar">
    <h1>📅 Jadwal Rilis Anime</h1>
    <p>Jadwal tayang anime ongoing setiap harinya</p>
  </div>

  <div class="schedule-grid" id="schedule-grid">
    <div style="grid-column:1/-1;text-align:center;padding:40px;color:#9ca3af;">Memuat...</div>
  </div>
</main>
<script src="../assets/js/main.js?v=2"></script>
<script>
const DAYS = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];

document.addEventListener('DOMContentLoaded', async () => {
  let data = await DB.load();

  // Load data/jadwal.json jika ada untuk memastikan jadwal tayang selalu lengkap
  try {
    const jRes = await fetch('../data/jadwal.json?t=' + Date.now());
    if (jRes.ok) {
      const jData = await jRes.json();
      const existingTitles = new Set((data || []).map(a => (a.title || '').toLowerCase()));
      for (const [day, items] of Object.entries(jData)) {
        if (day === 'Hiatus' || !Array.isArray(items)) continue;
        for (const it of items) {
          const tLower = (it.title || '').toLowerCase();
          if (!existingTitles.has(tLower)) {
            const slug = (it.title || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
            data.push({
              slug: slug,
              title: it.title,
              day: day,
              time: (it.time || '20:00').replace(/WIB/gi, '').trim(),
              status: 'Currently Airing',
              type: it.type || 'TV'
            });
            existingTitles.add(tLower);
          }
        }
      }
    }
  } catch (e) {}

  const ongoing = data.filter(a => a.status === 'Currently Airing' && a.day);

  // group by day
  const byDay = {};
  DAYS.forEach(d => byDay[d] = []);
  ongoing.forEach(a => { if (byDay[a.day]) byDay[a.day].push(a); });

  // today highlight
  const todayIdx = new Date().getDay(); // 0=Sun
  const todayName = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][todayIdx];

  const grid = document.getElementById('schedule-grid');
  grid.innerHTML = DAYS.map(day => {
    const animes = byDay[day];
    const isToday = day === todayName;
    return `<div class="schedule-day-card" style="${isToday ? 'border:2px solid #3384d6;' : ''}">
      <div class="schedule-day-header" style="${isToday ? 'background:#f5c518;color:#111;' : ''}">
        ${day} ${isToday ? '🔴 Hari Ini' : ''}
      </div>
      <ul class="schedule-day-list">
        ${animes.length ? animes.sort((a,b) => (a.time||'').localeCompare(b.time||'')).map(a => {
          const cleanTime = (a.time || '20:00').replace(/WIB/gi, '').trim();
          const poster = a.thumbnail || 'https://placehold.co/38x52/1e293b/fff?text=N%2FA';
          return `
          <li style="padding: 6px 0; border-bottom: 1px solid rgba(128,128,128,0.1);">
            <a href="anime.html?slug=${a.slug}" title="${a.title}" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
              <img src="${poster}" alt="${a.title}" loading="lazy" style="width: 38px; height: 52px; object-fit: cover; border-radius: 4px; flex-shrink: 0;" onerror="this.src='https://placehold.co/38x52/1e293b/fff?text=N%2FA'">
              <div style="flex-grow: 1; min-width: 0;">
                <div style="font-size: 13px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${a.title}</div>
                <span class="time-badge" style="display: inline-block; margin-top: 4px;">${cleanTime} WIB</span>
              </div>
            </a>
          </li>`;
        }).join('') : '<li style="padding:12px;color:#9ca3af;font-size:12px;">Tidak ada anime</li>'}
      </ul>
    </div>`;
  }).join('');
});
</script>
</body>
</html>
