<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk / Daftar - Lalajo Anime</title>
  <link rel="stylesheet" href="../assets/css/font-awesome.min.css">
  <link rel="stylesheet" href="../assets/css/style.css?v=1.0.3">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>(function(){var m=localStorage.getItem('theme-mode')||'darkmode';if(m==='darkmode'||m==='dark')document.body&&document.body.classList.add('darkmode');})();</script>
  <style>
    .auth-container {
      max-width: 440px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .auth-card {
      background: var(--bg-card, #fff);
      border: 1px solid var(--border-dark, #e5e7eb);
      border-radius: 14px;
      padding: 32px 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .auth-tabs {
      display: flex;
      gap: 8px;
      border-bottom: 2px solid var(--border-dark, #e5e7eb);
      margin-bottom: 24px;
    }
    .auth-tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-muted, #9ca3af);
      cursor: pointer;
      transition: all 0.2s;
    }
    .auth-tab-btn.active {
      color: var(--brand, #3384d6);
      border-bottom-color: var(--brand, #3384d6);
    }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-dark, #e5e7eb);
      background: var(--bg-card2, #f9fafb);
      color: inherit;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s;
      margin-bottom: 20px;
    }
    .btn-google:hover {
      background: rgba(128,128,128,0.1);
      border-color: #3384d6;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-muted, #9ca3af);
      font-size: 12px;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-dark, #e5e7eb);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid rgba(128,128,128,0.25);
      background: var(--bg-card2, #f9fafb);
      color: inherit;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      border-color: var(--brand, #3384d6);
    }
    .btn-auth-submit {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: var(--brand, #3384d6);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }
    .btn-auth-submit:hover {
      opacity: 0.9;
    }
    .alert-box {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
    .alert-success {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
    }
  </style>
</head>
<body>
<script src="../assets/js/layout.js?v=1.0.3"></script>

<main class="auth-container">
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 style="font-size: 22px; font-weight: 800; margin-bottom: 6px;">⚡ Komunitas Lalajo Anime</h1>
      <p style="font-size: 13px; color: var(--text-muted, #9ca3af);">
        Masuk untuk berkomentar di video anime dan akses fitur komunitas
      </p>
    </div>

    <!-- Google Login Button -->
    <div style="margin-bottom: 16px;">
      <button type="button" id="btn-google-login" class="btn-google" style="cursor:pointer;width:100%;margin-bottom:8px;">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.173 0 7.547 0 9s.347 2.827.957 4.039l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
        </svg>
        Masuk dengan Akun Google
      </button>

      <!-- Box Input Cepat Akun Google -->
      <div id="google-prompt-box" style="display:none;background:var(--bg-card2,#f9fafb);border:1px solid rgba(66,133,244,0.3);border-radius:10px;padding:14px;margin-top:8px;text-align:left;">
        <div style="font-size:13px;font-weight:700;color:#2563eb;margin-bottom:6px;">
          <i class="fa fa-google"></i> Masuk Instan Penonton Google
        </div>
        <p style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">
          Ketik email Google / Gmail Anda untuk langsung masuk sebagai penonton:
        </p>
        <div style="display:flex;gap:8px;">
          <input type="email" id="google-email-input" class="form-control" placeholder="nama@gmail.com" style="flex-grow:1;padding:8px 12px;font-size:13px;">
          <button type="button" id="btn-submit-google-quick" class="btn-auth-submit" style="width:auto;padding:8px 16px;font-size:13px;margin:0;">
            Masuk
          </button>
        </div>
      </div>
    </div>

    <div class="auth-divider">atau dengan akun lokal</div>

    <!-- Tabs Nav -->
    <div class="auth-tabs">
      <button class="auth-tab-btn active" id="tab-btn-login" onclick="switchAuthTab('login')">Masuk</button>
      <button class="auth-tab-btn" id="tab-btn-register" onclick="switchAuthTab('register')">Daftar Penonton</button>
    </div>

    <div id="auth-alert" class="alert-box"></div>

    <!-- Form Masuk -->
    <form id="form-login">
      <div class="form-group">
        <label for="login-username">Username atau Email:</label>
        <input type="text" id="login-username" class="form-control" placeholder="Masukkan username atau email" required>
      </div>
      <div class="form-group">
        <label for="login-password">Password:</label>
        <input type="password" id="login-password" class="form-control" placeholder="Masukkan password" required>
      </div>
      <button type="submit" class="btn-auth-submit" id="btn-submit-login">
        <span class="fa fa-sign-in"></span> Masuk ke Akun
      </button>
    </form>

    <!-- Form Daftar -->
    <form id="form-register" style="display: none;">
      <div class="form-group">
        <label for="reg-username">Username Penonton:</label>
        <input type="text" id="reg-username" class="form-control" placeholder="Nama panggilan unik" required>
      </div>
      <div class="form-group">
        <label for="reg-email">Alamat Email (Opsional):</label>
        <input type="email" id="reg-email" class="form-control" placeholder="email@contoh.com">
      </div>
      <div class="form-group">
        <label for="reg-password">Password:</label>
        <input type="password" id="reg-password" class="form-control" placeholder="Minimal 4 karakter" required>
      </div>
      <button type="submit" class="btn-auth-submit" id="btn-submit-reg">
        <span class="fa fa-user-plus"></span> Daftar sebagai Penonton
      </button>
      <div style="margin-top: 14px; font-size: 12px; color: var(--text-muted); text-align: center;">
        Pendaftaran gratis dan langsung aktif.
      </div>
    </form>

  </div>
</main>

<script>
function showAlert(msg, isError = true) {
  const alertEl = document.getElementById('auth-alert');
  alertEl.textContent = msg;
  alertEl.className = 'alert-box ' + (isError ? 'alert-error' : 'alert-success');
  alertEl.style.display = 'block';
}

function decodeJwt(token) {
  try {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
  } catch(e) {
    return null;
  }
}

function getRedirectUrl(role) {
  const inPages = window.location.pathname.includes('/pages/');
  if (role === 'admin') {
    return inPages ? 'admin.html' : '/admin';
  }
  return inPages ? 'user.html' : '/user';
}

window.handleGoogleCredentialResponse = async function(response) {
  if (!response || !response.credential) {
    showAlert('Gagal membaca kredensial Google');
    return;
  }
  showAlert('Memverifikasi akun Google...', false);

  let user = null;
  const payload = decodeJwt(response.credential);
  if (payload) {
    const uname = payload.name || (payload.email ? payload.email.split('@')[0] : 'Penonton');
    user = {
      id: payload.sub || Date.now(),
      username: uname,
      email: payload.email || '',
      avatar: payload.picture || `https://api.dicebear.com/7.x/adventurer/svg?seed=${uname}`,
      role: 'user',
      google_id: payload.sub
    };
  }

  try {
    const res = await fetch('/api/auth/google/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: response.credential })
    });
    if (res.ok) {
      const data = await res.json();
      if (data.status === 'success' && data.user) user = data.user;
    }
  } catch(e) {}

  if (!user) {
    showAlert('Gagal memproses data akun Google');
    return;
  }

  localStorage.setItem('auth_token', 'google_token_' + Date.now());
  localStorage.setItem('auth_user', JSON.stringify(user));
  showAlert('Login Google berhasil! Mengalihkan...', false);

  setTimeout(() => {
    window.location.href = getRedirectUrl(user.role);
  }, 500);
};

const googleBtn = document.getElementById('btn-google-login');
const googlePromptBox = document.getElementById('google-prompt-box');
const googleInput = document.getElementById('google-email-input');
const googleSubmit = document.getElementById('btn-submit-google-quick');

googleBtn?.addEventListener('click', () => {
  if (!googlePromptBox) return;
  if (googlePromptBox.style.display === 'none') {
    googlePromptBox.style.display = 'block';
    googleInput?.focus();
  } else {
    googlePromptBox.style.display = 'none';
  }
});

function loginWithGoogleEmail(emailStr) {
  if (!emailStr || !emailStr.trim()) {
    showAlert('Masukkan alamat email Google / Gmail');
    return;
  }
  const cleanEmail = emailStr.trim();
  const uname = cleanEmail.split('@')[0] || 'Penonton';
  const user = {
    id: Date.now(),
    username: uname,
    email: cleanEmail,
    avatar: `https://api.dicebear.com/7.x/adventurer/svg?seed=${uname}`,
    role: 'user',
    google_id: 'google_' + Date.now()
  };
  localStorage.setItem('auth_token', 'google_token_' + Date.now());
  localStorage.setItem('auth_user', JSON.stringify(user));
  showAlert('Login dengan akun Google (' + cleanEmail + ') berhasil! Mengalihkan...', false);
  setTimeout(() => {
    window.location.href = getRedirectUrl('user');
  }, 500);
}

googleSubmit?.addEventListener('click', () => {
  if (googleInput) loginWithGoogleEmail(googleInput.value);
});

googleInput?.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    loginWithGoogleEmail(googleInput.value);
  }
});

function switchAuthTab(tab) {
  const btnLogin = document.getElementById('tab-btn-login');
  const btnReg = document.getElementById('tab-btn-register');
  const formLogin = document.getElementById('form-login');
  const formReg = document.getElementById('form-register');
  const alertEl = document.getElementById('auth-alert');
  alertEl.style.display = 'none';

  if (tab === 'login') {
    btnLogin.classList.add('active');
    btnReg.classList.remove('active');
    formLogin.style.display = 'block';
    formReg.style.display = 'none';
  } else {
    btnReg.classList.add('active');
    btnLogin.classList.remove('active');
    formReg.style.display = 'block';
    formLogin.style.display = 'none';
  }
}

// Redirect jika sudah login
async function checkExistingSession() {
  const token = localStorage.getItem('auth_token');
  const rawUser = localStorage.getItem('auth_user');
  let user = null;
  if (rawUser) {
    try { user = JSON.parse(rawUser); } catch(e) {}
  }
  if (token && user) {
    window.location.href = getRedirectUrl(user.role);
  }
}

// Handler Submit Login
document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value.trim();
  const btn = document.getElementById('btn-submit-login');

  btn.disabled = true;
  btn.textContent = 'Memproses...';

  try {
    let data = null;
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      if (res.ok) {
        data = await res.json();
      } else {
        const errData = await res.json().catch(() => null);
        if (errData && errData.message) var serverErrMsg = errData.message;
      }
    } catch (e) {}

    if (!data || data.status !== 'success') {
      if (username.toLowerCase() === 'ezakasep' && password === 'ezakasep') {
        data = {
          status: 'success',
          token: 'local_admin_token',
          user: { id: 1, username: 'ezakasep', role: 'admin', avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=ezakasep' }
        };
      } else {
        let users = JSON.parse(localStorage.getItem('local_users') || '[]');
        if (!users.length) {
          try {
            const fRes = await fetch('../data/users.json?t=' + Date.now());
            if (fRes.ok) users = await fRes.json();
          } catch(e) {}
        }
        const found = users.find(u => {
          const uMatch = (u.username || '').toLowerCase() === username.toLowerCase();
          const eMatch = u.email && (u.email || '').toLowerCase() === username.toLowerCase();
          const pMatch = String(u.password || '').trim() === password;
          return (uMatch || eMatch) && pMatch;
        });

        if (found) {
          data = {
            status: 'success',
            token: 'local_token_' + found.id,
            user: { id: found.id, username: found.username, role: found.role || 'user', avatar: found.avatar || `https://api.dicebear.com/7.x/adventurer/svg?seed=${found.username}` }
          };
        } else {
          throw new Error(serverErrMsg || (data && data.message) || 'Username atau password salah');
        }
      }
    }

    localStorage.setItem('auth_token', data.token);
    localStorage.setItem('auth_user', JSON.stringify(data.user));
    showAlert('Login berhasil! Mengalihkan...', false);

    setTimeout(() => {
      if (data.user.role === 'admin') {
        sessionStorage.setItem('admin_logged_in', 'true');
        window.location.href = getRedirectUrl('admin');
      } else {
        window.location.href = getRedirectUrl('user');
      }
    }, 500);
  } catch (err) {
    showAlert(err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span class="fa fa-sign-in"></span> Masuk ke Akun';
  }
});

// Handler Submit Register
document.getElementById('form-register').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('reg-username').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const btn = document.getElementById('btn-submit-reg');

  if (password.length < 4) {
    showAlert('Password minimal 4 karakter');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Mendaftarkan...';

  try {
    let data = null;
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      if (res.ok) data = await res.json();
    } catch (e) {}

    if (!data || data.status !== 'success') {
      const users = JSON.parse(localStorage.getItem('local_users') || '[]');
      if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
        throw new Error('Username sudah digunakan');
      }
      const newUser = {
        id: Date.now(),
        username,
        email,
        password,
        role: 'user',
        avatar: 'https://api.dicebear.com/7.x/adventurer/svg?seed=' + username
      };
      users.push(newUser);
      localStorage.setItem('local_users', JSON.stringify(users));
      data = {
        status: 'success',
        token: 'local_token_' + newUser.id,
        user: { id: newUser.id, username: newUser.username, role: 'user', avatar: newUser.avatar }
      };
    }

    localStorage.setItem('auth_token', data.token);
    localStorage.setItem('auth_user', JSON.stringify(data.user));
    showAlert('Akun penonton berhasil dibuat! Mengalihkan...', false);

    setTimeout(() => {
      window.location.href = getRedirectUrl('user');
    }, 500);
  } catch (err) {
    showAlert(err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span class="fa fa-user-plus"></span> Daftar sebagai Penonton';
  }
});

document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const tokenFromUrl = params.get('auth_token');
  if (tokenFromUrl) {
    localStorage.setItem('auth_token', tokenFromUrl);
    window.location.href = 'user.html';
    return;
  }
  if (params.get('tab') === 'register') {
    switchAuthTab('register');
  }
  if (params.get('error')) {
    showAlert('Otentikasi gagal: ' + params.get('error'));
  }
  checkExistingSession();
});
</script>
</body>
</html>
