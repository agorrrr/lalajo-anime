<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tonton Anime - Lalajo Anime</title>
  <link rel="stylesheet" href="../assets/css/font-awesome.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .video-area {
      background:#111; border-radius:10px; overflow:hidden;
      aspect-ratio:16/9; display:flex; align-items:center; justify-content:center;
      position:relative; margin-bottom:16px;
      background-size:cover; background-position:center; background-repeat:no-repeat;
      cursor:pointer;
    }
    .video-area.playing {
      cursor:default;
      background-image:none !important;
    }
    .video-area::before {
      content:''; position:absolute; inset:0;
      background:linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.7) 100%);
      z-index:1;
      pointer-events:none;
    }
    .video-area.playing::before {
      display:none !important;
    }
    .video-area iframe, .video-area video {
      position:relative; z-index:10; width:100%; height:100%; border:none;
    }
    .video-area:fullscreen, .video-area:-webkit-full-screen {
      width:100vw !important; height:100vh !important; max-width:100vw !important;
      border-radius:0 !important; aspect-ratio:auto !important; background:#000 !important;
    }
    .video-area:fullscreen video, .video-area:-webkit-full-screen video,
    .video-area:fullscreen iframe, .video-area:-webkit-full-screen iframe {
      width:100vw !important; height:100vh !important;
    }
    .video-placeholder {
      position:relative; z-index:2;
      text-align:center; color:#fff; padding:20px;
    }
    .video-placeholder .play-big {
      font-size:72px; color:rgba(255,255,255,0.9); margin-bottom:12px; display:inline-block;
      cursor:pointer; transition:transform 0.2s, color 0.2s;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
    }
    .video-placeholder .play-big:hover { transform:scale(1.1); color:#3384d6; }
    .server-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    .server-tab {
      padding:7px 16px; border-radius:6px; border:1px solid #e5e7eb;
      background:#f9fafb; color:#374151; font-size:13px; font-weight:600;
      cursor:pointer; transition:all 0.15s;
    }
    body.darkmode .server-tab { background:#222327; color:#d1d5db; border-color:rgba(255,255,255,0.1); }
    .server-tab.active, .server-tab:hover { background:#3384d6; color:#fff; border-color:#3384d6; }
    .ep-nav { display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
    .ep-nav a {
      padding:8px 16px; border-radius:8px; background:#3384d6; color:#fff;
      text-decoration:none; font-size:13px; font-weight:700; transition:background 0.15s;
    }
    .ep-nav a:hover { background:#2563ab; }
    .ep-nav a.disabled { background:#9ca3af; pointer-events:none; }
    .ep-nav .ep-label { font-size:16px; font-weight:800; }
  </style>
</head>
<body>
<script src="../assets/js/layout.js"></script>
<main id="content">
  <div id="watch-content">
    <div style="text-align:center;padding:80px;color:#9ca3af;">
      <i class="fa fa-spinner fa-spin" style="font-size:32px;"></i>
      <p style="margin-top:12px;">Memuat...</p>
    </div>
  </div>
</main>
<script src="../assets/js/main.js?v=2"></script>
<script src="../assets/js/ads.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const params  = new URLSearchParams(window.location.search);
  const slug    = params.get('slug');
  const epNum   = parseInt(params.get('ep')) || 1;
  const data    = await DB.load();
  const anime   = data.find(a => a.slug === slug || String(a.id) === slug || (a.slug && slug && a.slug.toLowerCase() === slug.toLowerCase()));
  const content = document.getElementById('watch-content');

  if (!anime) {
    content.innerHTML = `<div class="no-results"><i class="fa fa-exclamation-circle" style="font-size:48px;color:#ef4444;"></i><p>Anime tidak ditemukan</p><a href="anime-list.html" style="color:#3384d6;">← Daftar Anime</a></div>`;
    return;
  }

  const ep = anime.episodes_list.find(e => e.ep === epNum) || anime.episodes_list[0];
  if (!ep) {
    content.innerHTML = `<div class="no-results"><p>Episode tidak tersedia.</p><a href="anime.html?slug=${slug}" style="color:#3384d6;">← Kembali ke detail</a></div>`;
    return;
  }

  document.title = `${anime.title} - Ep ${ep.ep} - Lalajo Anime`;

  const prevEp = anime.episodes_list.find(e => e.ep === epNum - 1);
  const nextEp = anime.episodes_list.find(e => e.ep === epNum + 1);

  // Stream servers
  const streamServers = (ep.servers && ep.servers.length > 0)
    ? ep.servers
    : (ep.stream_url ? [ep.stream_url] : []);

  let serverTabsHTML = '';
  if (streamServers.length > 0) {
    serverTabsHTML = streamServers.slice(0, 4).map((s, idx) => `
      <button class="server-tab ${idx===0?'active':''}" data-server-idx="${idx}">
        <i class="fa fa-play-circle"></i> Server ${idx + 1}
      </button>
    `).join('');
  } else {
    serverTabsHTML = `
      <button class="server-tab active" data-server="html5"><i class="fa fa-play-circle"></i> Server 1 (HTML5 Fullscreen)</button>
      <button class="server-tab" data-server="embed"><i class="fa fa-cloud"></i> Server 2 (Embed)</button>
    `;
  }

  // Related episodes
  const epListHTML = anime.episodes_list.map(e => `
    <a href="watch?slug=${slug}&ep=${e.ep}"
       style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px;
              text-decoration:none;color:inherit;transition:background 0.15s;
              ${e.ep === epNum ? 'background:#3384d622;border:1px solid #3384d644;' : 'border:1px solid transparent;'}">
      <span class="ep-num" style="width:28px;height:28px;border-radius:6px;background:${e.ep===epNum?'#3384d6':'#374151'};color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;">${e.ep}</span>
      <div>
        <div style="font-size:13px;font-weight:600;">Episode ${e.ep}</div>
        <div style="font-size:11px;color:#9ca3af;">${e.date}</div>
      </div>
    </a>
  `).join('');

  const isVip = typeof AdsManager !== 'undefined' && AdsManager.isAdFreeUser();
  const vipBadgeHtml = isVip ? `<span style="background:rgba(234,179,8,0.18);color:#eab308;border:1px solid rgba(234,179,8,0.4);border-radius:14px;padding:3px 10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;margin-left:8px;"><i class="fa fa-star"></i> Bebas Iklan (VIP/Admin)</span>` : '';

  content.innerHTML = `
    <nav style="font-size:13px;color:#9ca3af;margin-bottom:20px;">
      <a href="../" style="color:#3384d6;text-decoration:none;">Beranda</a> ›
      <a href="anime?slug=${slug}" style="color:#3384d6;text-decoration:none;">${anime.title}</a> ›
      Episode ${ep.ep}
    </nav>

    <!-- Slot Iklan Banner Atas (728x90) -->
    <div class="ad-slot-top" style="margin: 0 auto 20px; text-align: center; max-width: 728px; min-height: 50px;"></div>

    <div style="display:grid;grid-template-columns:1fr;gap:24px;" id="watch-grid">

      <!-- Player area -->
      <div>
        <h1 style="font-size:18px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;">
          <span>${anime.title} <span style="color:#9ca3af;font-weight:400;">— Episode ${ep.ep}: ${ep.title}</span></span>
          ${vipBadgeHtml}
        </h1>

        <!-- Video player container -->
        <div class="video-area">
          <div class="video-placeholder">
            <span class="play-big fa fa-play-circle" id="play-btn"></span>
            <div style="font-size:16px;font-weight:700;margin-bottom:6px;">${anime.title}</div>
            <div style="font-size:13px;opacity:0.8;">Episode ${ep.ep}: ${ep.title}</div>
            <div style="margin-top:12px;font-size:13px;opacity:0.9;">
              <span class="fa fa-play"></span> Putar Video
            </div>
          </div>
        </div>

        <!-- Server tabs & Tombol Fullscreen -->
        <div class="server-tabs" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
          ${serverTabsHTML}
          <button class="server-tab" id="btn-fullscreen" style="margin-left:auto;background:#10b981;color:#fff;border-color:#10b981;font-weight:700;">
            <i class="fa fa-arrows-alt"></i> ⛶ Layar Penuh
          </button>
        </div>

        <!-- Slot Iklan Banner Bawah Player (728x90) -->
        <div class="ad-slot-player-bottom" style="margin: 16px auto; text-align: center; max-width: 728px; min-height: 50px;"></div>

        <!-- Episode navigation -->
        <div class="ep-nav">
          ${prevEp
            ? `<a href="watch?slug=${slug}&ep=${prevEp.ep}">&#8592; Episode ${prevEp.ep}</a>`
            : `<a class="disabled">&#8592; Ep Sebelumnya</a>`}
          <span class="ep-label">Episode ${ep.ep} / ${anime.episodes}</span>
          ${nextEp
            ? `<a href="watch?slug=${slug}&ep=${nextEp.ep}">Episode ${nextEp.ep} &#8594;</a>`
            : `<a class="disabled">Ep Berikutnya &#8594;</a>`}
        </div>

        <!-- Anime info quick -->
        <div style="display:flex;gap:12px;align-items:center;padding:12px;background:var(--bg-card,#f9fafb);border-radius:8px;border:1px solid rgba(0,0,0,0.06);">
          <img src="${anime.thumbnail}" alt="${anime.title}" style="width:50px;height:70px;object-fit:cover;border-radius:6px;" onerror="this.src='https://placehold.co/50x70/333/fff?text=N%2FA'">
          <div>
            <div style="font-weight:700;font-size:14px;">${anime.title}</div>
            <div style="font-size:12px;color:#9ca3af;margin-top:2px;">${anime.type} · ⭐ ${anime.score.toFixed(2)} · ${anime.studio}</div>
            <a href="anime?slug=${slug}" style="font-size:12px;color:#3384d6;text-decoration:none;margin-top:4px;display:inline-block;">Lihat Detail →</a>
          </div>
        </div>

        <!-- Kolom Komentar Penonton -->
        <div class="comments-section" style="margin-top:20px;background:var(--bg-card,#fff);border:1px solid var(--border-dark,#e5e7eb);border-radius:10px;padding:20px;">
          <h3 style="font-size:16px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px;">
            <i class="fa fa-comments" style="color:#3384d6;"></i> Diskusi Episode Ini (<span id="comment-count">0</span>)
          </h3>

          <div id="comment-input-area"></div>

          <div id="comments-list" style="margin-top:20px;display:flex;flex-direction:column;gap:14px;">
            <div style="text-align:center;color:#9ca3af;font-size:13px;padding:16px;">Memuat komentar...</div>
          </div>
        </div>
      </div>

      <!-- Episode list sidebar -->
      <div>
        <div class="section-title">Daftar Episode</div>
        <div style="display:flex;flex-direction:column;gap:4px;max-height:500px;overflow-y:auto;">
          ${epListHTML || '<p style="color:#9ca3af;font-size:14px;">Belum ada episode</p>'}
        </div>
      </div>
    </div>
  `;

  // 2-col on desktop
  const s = document.createElement('style');
  s.textContent = `@media(min-width:900px){#watch-grid{grid-template-columns:1fr 280px !important;}}`;
  document.head.appendChild(s);

  // server tab click
  document.querySelectorAll('.server-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.server-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
    });
  });

  // Capture frame acak dari potongan video
  const sampleVideoUrl = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";

  function captureRandomVideoFrame(videoSrc) {
    const vid = document.createElement('video');
    vid.crossOrigin = 'anonymous';
    vid.preload = 'auto';
    vid.muted = true;
    vid.src = videoSrc;

    vid.addEventListener('loadedmetadata', () => {
      const duration = vid.duration || 60;
      const randSec = (Math.random() * 0.8 + 0.05) * duration;
      vid.currentTime = randSec;
    });

    vid.addEventListener('seeked', () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = vid.videoWidth || 640;
        canvas.height = vid.videoHeight || 360;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

        const vArea = document.querySelector('.video-area');
        if (vArea) {
          vArea.style.backgroundImage = `url("${dataUrl}")`;
        }
      } catch (err) {
        console.warn('Canvas frame capture:', err);
      }
    });
  }

  // Set thumbnail cuplikan video awal
  if (ep.drive_file_id) {
    const driveThumb = `https://drive.google.com/thumbnail?id=${ep.drive_file_id}&sz=w1280`;
    const vArea = document.querySelector('.video-area');
    if (vArea) {
      vArea.style.backgroundImage = `url("${driveThumb}")`;
    }
  } else if (anime.thumbnail) {
    const vArea = document.querySelector('.video-area');
    if (vArea) {
      vArea.style.backgroundImage = `url("${anime.thumbnail}")`;
    }
  } else {
    captureRandomVideoFrame(sampleVideoUrl);
  }

  let activeServer = 'html5';
  let activeServerIdx = 0;

  // play btn click - load video player (HTML5 native dengan Fullscreen / Drive embed fallback / Scraped stream)
  function loadVideo() {
    const vArea = document.querySelector('.video-area');
    if (!vArea) return;
    const centerAd = document.getElementById('player-center-ad');
    if (centerAd) centerAd.remove();
    vArea.classList.add('playing');

    if (streamServers.length > 0) {
      const currentStream = streamServers[activeServerIdx] || streamServers[0];
      if (currentStream.endsWith('.mp4')) {
        vArea.innerHTML = `
          <video controls autoplay playsinline style="width:100%;height:100%;object-fit:contain;background:#000;position:relative;z-index:10;">
            <source src="${currentStream}" type="video/mp4">
            Browser tidak mendukung pemutaran video.
          </video>
        `;
      } else {
        vArea.innerHTML = `
          <iframe src="${currentStream}"
                  allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
                  allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"
                  style="width:100%;height:100%;border:none;background:#000;position:relative;z-index:10;"></iframe>
        `;
      }
      return;
    }

    if (activeServer === 'html5') {
      const videoSrc = ep.drive_file_id
        ? `/api/video/stream?id=${ep.drive_file_id}`
        : sampleVideoUrl;
      const fallbackIframe = ep.drive_file_id
        ? `this.outerHTML='<iframe src=\\'https://drive.google.com/file/d/${ep.drive_file_id}/preview\\' allow=\\'autoplay; fullscreen; picture-in-picture\\' allowfullscreen=\\'true\\' webkitallowfullscreen=\\'true\\' mozallowfullscreen=\\'true\\' style=\\'width:100%;height:100%;border:none;background:#000;position:relative;z-index:10;\\'></iframe>';`
        : ``;
      vArea.innerHTML = `
        <video controls autoplay playsinline style="width:100%;height:100%;object-fit:contain;background:#000;position:relative;z-index:10;" onerror="${fallbackIframe}">
          <source src="${videoSrc}" type="video/mp4" onerror="${fallbackIframe}">
          Browser tidak mendukung pemutaran video.
        </video>
      `;
    } else {
      if (ep.drive_file_id) {
        vArea.innerHTML = `
          <iframe src="https://drive.google.com/file/d/${ep.drive_file_id}/preview"
                  allow="autoplay; fullscreen; picture-in-picture"
                  allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"
                  style="width:100%;height:100%;border:none;background:#000;position:relative;z-index:10;"></iframe>
        `;
      } else {
        vArea.innerHTML = `
          <video controls autoplay playsinline style="width:100%;height:100%;object-fit:contain;background:#000;position:relative;z-index:10;">
            <source src="${sampleVideoUrl}" type="video/mp4">
            Browser tidak mendukung pemutaran video.
          </video>
        `;
      }
    }
  }

  // Switch server
  document.querySelectorAll('.server-tab[data-server-idx]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.server-tab[data-server-idx]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeServerIdx = parseInt(btn.dataset.serverIdx) || 0;
      const vArea = document.querySelector('.video-area');
      if (vArea && vArea.classList.contains('playing')) {
        loadVideo();
      }
    });
  });

  document.querySelectorAll('.server-tab[data-server]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.server-tab[data-server]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeServer = btn.dataset.server;
      const vArea = document.querySelector('.video-area');
      if (vArea && vArea.classList.contains('playing')) {
        loadVideo();
      }
    });
  });

  // Tombol Layar Penuh (Fullscreen API Universal)
  document.getElementById('btn-fullscreen')?.addEventListener('click', () => {
    const vArea = document.querySelector('.video-area');
    if (!vArea) return;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (vArea.requestFullscreen) {
        vArea.requestFullscreen();
      } else if (vArea.webkitRequestFullscreen) {
        vArea.webkitRequestFullscreen();
      } else if (vArea.msRequestFullscreen) {
        vArea.msRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    }
  });

  // Pasang fitur popunder (klik 1 dan 2 buka tab iklan, klik 3 play video)
  AdsManager.setupVideoPopunder(document.querySelector('.video-area'), loadVideo);
  AdsManager.initSlots();

  // ── Fitur Komentar Episode & Emoji Picker ──
  let authUser = null;
  const authToken = localStorage.getItem('auth_token');
  try {
    const raw = localStorage.getItem('auth_user');
    if (raw) authUser = JSON.parse(raw);
  } catch(e) {}

  const EMOJI_PACK = {
    '🔥 Populer': ['🔥', '😂', '😍', '👍', '😭', '👏', '🎉', '🍿', '💯', '⭐', '⚡', '✨'],
    '😃 Ekspresi': ['😀', '😃', '😄', '😁', '😆', '😅', '🤣', '😂', '🙂', '😉', '😊', '🥰', '😍', '🤩', '😘', '😋', '😛', '😜', '🤪', '😎', '🤓', '🧐', '🤔', '🤐', '🤨', '😐', '😏', '😒', '🙄', '😬', '😔', '😴', '😷', '🥵', '🥶', '🤯', '🥳', '🥺', '😢', '😭', '😱', '😡', '🤬', '😈', '💀'],
    '👍 Reaksi': ['👍', '👎', '👊', '✊', '🤛', '🤜', '👏', '🙌', '👐', '🤝', '🙏', '✍️', '💪', '👈', '👉', '👆', '👇', '✌️', '🤞', '🖖', '🤘', '🤙', '👌'],
    '❤️ Hati': ['❤️', '🧡', '💛', '💚', '💙', '💜', '🖤', '🤍', '💔', '❣️', '💕', '💞', '💓', '💗', '💖', '💘', '💯', '✨', '🌟', '⭐', '💥', '💢', '💤'],
    '🎌 Anime': ['🍿', '🍙', '🍜', '🍣', '🍱', '🎮', '🎯', '🏆', '👑', '🎬', '🗡️', '🛡️', '🪄', '🎭', '🎌', '🇯🇵', '🐱', '🦊', '🐉', '🦄']
  };

  window.insertEmoji = function(targetId, emoji) {
    const el = document.getElementById(targetId);
    if (!el) return;
    const start = el.selectionStart || el.value.length;
    const end = el.selectionEnd || el.value.length;
    el.value = el.value.substring(0, start) + emoji + el.value.substring(end);
    el.focus();
    el.selectionStart = el.selectionEnd = start + emoji.length;
  };

  window.toggleEmojiModal = function(targetTextareaId) {
    let modal = document.getElementById('emoji-picker-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'emoji-picker-modal';
      modal.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:99999;width:320px;max-width:90vw;background:var(--bg-card,#fff);border:1px solid var(--border-dark,#e5e7eb);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.2);padding:14px;display:none;';
      document.body.appendChild(modal);
    }

    if (modal.dataset.target === targetTextareaId && modal.style.display === 'block') {
      modal.style.display = 'none';
      return;
    }

    modal.dataset.target = targetTextareaId;
    let categoriesHtml = Object.keys(EMOJI_PACK).map((cat, idx) => `
      <button type="button" class="emoji-tab-btn ${idx===0?'active':''}" data-cat="${cat}" style="padding:4px 8px;font-size:11px;font-weight:700;border:none;background:${idx===0?'#3384d6':'rgba(128,128,128,0.1)'};color:${idx===0?'#fff':'inherit'};border-radius:6px;cursor:pointer;">
        ${cat}
      </button>
    `).join('');

    modal.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <strong style="font-size:13px;display:flex;align-items:center;gap:6px;">😀 Pilih Emoji</strong>
        <button type="button" onclick="document.getElementById('emoji-picker-modal').style.display='none'" style="background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;">&times;</button>
      </div>
      <div style="display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;" id="emoji-cat-tabs">
        ${categoriesHtml}
      </div>
      <div id="emoji-grid-area" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-height:180px;overflow-y:auto;padding:4px;">
        ${EMOJI_PACK['🔥 Populer'].map(em => `<button type="button" onclick="insertEmoji('${targetTextareaId}', '${em}')" style="background:none;border:none;font-size:20px;padding:4px;cursor:pointer;border-radius:4px;transition:background 0.15s;" onmouseover="this.style.background='rgba(51,132,214,0.15)'" onmouseout="this.style.background='none'">${em}</button>`).join('')}
      </div>
    `;

    modal.querySelectorAll('.emoji-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        modal.querySelectorAll('.emoji-tab-btn').forEach(b => {
          b.style.background = 'rgba(128,128,128,0.1)';
          b.style.color = 'inherit';
        });
        btn.style.background = '#3384d6';
        btn.style.color = '#fff';
        const cat = btn.dataset.cat;
        const grid = document.getElementById('emoji-grid-area');
        grid.innerHTML = EMOJI_PACK[cat].map(em => `
          <button type="button" onclick="insertEmoji('${targetTextareaId}', '${em}')" style="background:none;border:none;font-size:20px;padding:4px;cursor:pointer;border-radius:4px;transition:background 0.15s;" onmouseover="this.style.background='rgba(51,132,214,0.15)'" onmouseout="this.style.background='none'">${em}</button>
        `).join('');
      });
    });

    modal.style.display = 'block';
  };

  function renderCommentInput() {
    const area = document.getElementById('comment-input-area');
    if (!area) return;

    if (authToken && authUser) {
      let userBadge = '<span style="font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;margin-left:4px;background:#3384d622;color:#3384d6;">👤 Penonton</span>';
      if (authUser.role === 'admin') userBadge = '<span style="font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:4px;background:#ef444422;color:#ef4444;">👑 Admin</span>';
      else if (authUser.role === 'vip') userBadge = '<span style="font-size:11px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:4px;background:rgba(234,179,8,0.2);color:#eab308;">⭐ VIP</span>';

      const quickEmojis = ['👍', '❤️', '🔥', '😂', '😭', '👏', '🎉', '🍿', '💯', '⭐'];

      area.innerHTML = `
        <div style="display:flex;gap:12px;align-items:flex-start;">
          <img src="${authUser.avatar || 'https://api.dicebear.com/7.x/adventurer/svg?seed=' + authUser.username}"
               alt="${authUser.username}"
               style="width:40px;height:40px;border-radius:50%;border:2px solid #3384d6;object-fit:cover;flex-shrink:0;">
          <div style="flex-grow:1;">
            <div style="font-size:13px;font-weight:700;margin-bottom:6px;">
              ${authUser.username}
              ${userBadge}
            </div>
            <textarea id="comment-textarea"
                      placeholder="Tulis pendapat atau komentar kamu tentang episode ini..."
                      rows="3"
                      style="width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid rgba(128,128,128,0.25);background:var(--bg-card2,#f9fafb);color:inherit;font-size:13px;outline:none;resize:vertical;"></textarea>
            
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap;gap:8px;">
              <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;">
                ${quickEmojis.map(em => `<button type="button" onclick="insertEmoji('comment-textarea', '${em}')" title="Kirim ${em}" style="background:none;border:none;font-size:16px;cursor:pointer;padding:3px 5px;border-radius:4px;transition:transform 0.1s;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">${em}</button>`).join('')}
                <button type="button" onclick="toggleEmojiModal('comment-textarea')" style="background:rgba(128,128,128,0.12);border:none;font-size:12px;font-weight:700;cursor:pointer;padding:4px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;color:inherit;margin-left:4px;">
                  😀 Emoji
                </button>
              </div>
              <button id="btn-submit-comment"
                      style="background:#3384d6;color:#fff;border:none;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;">
                <i class="fa fa-paper-plane"></i> Kirim Komentar
              </button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('btn-submit-comment')?.addEventListener('click', () => postComment(null));
    } else {
      area.innerHTML = `
        <div style="background:var(--bg-card2,#f9fafb);border:1px dashed var(--border-dark,#e5e7eb);border-radius:8px;padding:16px;text-align:center;">
          <p style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">
            <i class="fa fa-lock"></i> Masuk atau daftar untuk ikut berdiskusi di kolom komentar.
          </p>
          <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">
            <a href="login.html" style="background:#3384d6;color:#fff;text-decoration:none;padding:7px 16px;border-radius:6px;font-size:12px;font-weight:700;">
              <i class="fa fa-sign-in"></i> Masuk Akun
            </a>
            <a href="login.html?tab=register" style="background:none;border:1px solid #3384d6;color:#3384d6;text-decoration:none;padding:7px 16px;border-radius:6px;font-size:12px;font-weight:700;">
              <i class="fa fa-user-plus"></i> Daftar Penonton
            </a>
          </div>
        </div>
      `;
    }
  }

  window.toggleReplyBox = function(cid, encodedUsername) {
    const box = document.getElementById(`reply-box-${cid}`);
    if (!box) {
      console.warn('Reply box tidak ditemukan untuk ID:', cid);
      return;
    }

    const isHidden = box.style.display === 'none' || !box.style.display;
    if (isHidden) {
      box.style.display = 'block';
      const ta = document.getElementById(`reply-textarea-${cid}`);
      if (ta) {
        const uName = encodedUsername ? decodeURIComponent(encodedUsername) : '';
        if (uName && !ta.value.trim()) {
          ta.value = `@${uName} `;
        }
        setTimeout(() => ta.focus(), 60);
      }
      try {
        box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } catch (e) {}
    } else {
      box.style.display = 'none';
    }
  };

  async function loadComments() {
    const listEl = document.getElementById('comments-list');
    const countEl = document.getElementById('comment-count');
    if (!listEl) return;

    let comments = [];
    try {
      const res = await fetch(`/api/comments?slug=${encodeURIComponent(slug)}&ep=${epNum}`);
      if (res.ok) {
        const data = await res.json();
        if (data && data.status === 'success') comments = data.comments || [];
      }
    } catch (e) {}

    // Fallback static data/comments.json jika API serverless cold
    if (!comments.length) {
      try {
        const fallbackRes = await fetch('../data/comments.json?t=' + Date.now());
        if (fallbackRes.ok) {
          const allComments = await fallbackRes.json();
          comments = allComments.filter(c => c.anime_slug === slug && String(c.ep) === String(epNum));
        }
      } catch (e) {}
    }

    // Merge dengan komentar local yang baru dikirim jika ada
    const localPending = JSON.parse(localStorage.getItem(`comments_${slug}_${epNum}`) || '[]');
    if (localPending.length) {
      const existingIds = new Set(comments.map(c => c.id));
      const newItems = localPending.filter(c => !existingIds.has(c.id));
      comments = [...newItems, ...comments];
    }

    if (countEl) countEl.textContent = comments.length;

    if (!comments.length) {
      listEl.innerHTML = `
        <div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px;">
          <i class="fa fa-comment-o" style="font-size:24px;margin-bottom:6px;opacity:0.5;"></i>
          <p>Belum ada komentar untuk episode ini. Jadilah yang pertama berkomentar!</p>
        </div>
      `;
      return;
    }

    // Pisahkan komentar utama (root) dan balasan (replies)
    const rootComments = comments.filter(c => !c.parent_id);
    const replyMap = {};
    comments.filter(c => c.parent_id).forEach(r => {
      if (!replyMap[r.parent_id]) replyMap[r.parent_id] = [];
      replyMap[r.parent_id].push(r);
    });

    listEl.innerHTML = rootComments.map(c => {
      const canDelete = authUser && (authUser.role === 'admin' || authUser.id === c.user_id);
      let roleLabel = '<span style="font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(51,132,214,0.15);color:#3384d6;font-weight:600;">👤 Penonton</span>';
      if (c.user_role === 'admin') {
        roleLabel = '<span style="font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(239,68,68,0.15);color:#ef4444;font-weight:700;">👑 Admin</span>';
      } else if (c.user_role === 'vip') {
        roleLabel = '<span style="font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(234,179,8,0.2);color:#eab308;font-weight:800;">⭐ VIP</span>';
      }

      const childReplies = replyMap[c.id] || [];

      const repliesHtml = childReplies.map(r => {
        const canDeleteReply = authUser && (authUser.role === 'admin' || authUser.id === r.user_id);
        let rRoleLabel = '<span style="font-size:9px;padding:1px 5px;border-radius:4px;background:rgba(51,132,214,0.15);color:#3384d6;font-weight:600;">👤 Penonton</span>';
        if (r.user_role === 'admin') rRoleLabel = '<span style="font-size:9px;padding:1px 5px;border-radius:4px;background:rgba(239,68,68,0.15);color:#ef4444;font-weight:700;">👑 Admin</span>';
        else if (r.user_role === 'vip') rRoleLabel = '<span style="font-size:9px;padding:1px 5px;border-radius:4px;background:rgba(234,179,8,0.2);color:#eab308;font-weight:800;">⭐ VIP</span>';

        return `
          <div style="display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:6px;background:rgba(128,128,128,0.05);border:1px solid rgba(128,128,128,0.08);">
            <img src="${r.avatar || 'https://api.dicebear.com/7.x/adventurer/svg?seed=' + encodeURIComponent(r.username)}"
                 alt="${r.username}"
                 style="width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;">
            <div style="flex-grow:1;">
              <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;">
                <div style="display:flex;align-items:center;gap:6px;">
                  <strong style="font-size:12px;">${escapeHtml(r.username)}</strong>
                  ${rRoleLabel}
                  <span style="font-size:10px;color:var(--text-muted);">${r.created_at}</span>
                </div>
                <div style="display:flex;align-items:center;gap:6px;">
                  <button type="button" onclick="toggleReplyBox('${c.id}', '${encodeURIComponent(r.username)}')" title="Balas balasan ini" style="background:none;border:none;color:#3384d6;font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;">
                    <i class="fa fa-reply"></i> Balas
                  </button>
                  ${canDeleteReply ? `
                    <button type="button" onclick="deleteCommentItem('${r.id}')" title="Hapus Balasan" style="background:none;border:none;color:#ef4444;font-size:11px;cursor:pointer;opacity:0.8;">
                      <i class="fa fa-trash"></i>
                    </button>
                  ` : ''}
                </div>
              </div>
              <div style="font-size:12px;margin-top:4px;line-height:1.5;white-space:pre-wrap;color:inherit;">${escapeHtml(r.content)}</div>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div style="display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:8px;background:var(--bg-card2,#f9fafb);border:1px solid rgba(128,128,128,0.1);">
          <div style="display:flex;gap:12px;align-items:flex-start;">
            <img src="${c.avatar || 'https://api.dicebear.com/7.x/adventurer/svg?seed=' + encodeURIComponent(c.username)}"
                 alt="${c.username}"
                 style="width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;">
            <div style="flex-grow:1;">
              <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
                <div style="display:flex;align-items:center;gap:6px;">
                  <strong style="font-size:13px;">${escapeHtml(c.username)}</strong>
                  ${roleLabel}
                  <span style="font-size:11px;color:var(--text-muted);">${c.created_at}</span>
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                  <button type="button"
                          onclick="toggleReplyBox('${c.id}', '${encodeURIComponent(c.username)}')"
                          title="Balas komentar ini"
                          style="background:none;border:none;color:#3384d6;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border-radius:4px;">
                    <i class="fa fa-reply"></i> Balas
                  </button>
                  ${canDelete ? `
                    <button type="button"
                            onclick="deleteCommentItem('${c.id}')"
                            title="Hapus Komentar"
                            style="background:none;border:none;color:#ef4444;font-size:11px;cursor:pointer;opacity:0.8;">
                      <i class="fa fa-trash"></i>
                    </button>
                  ` : ''}
                </div>
              </div>
              <div style="font-size:13px;margin-top:6px;line-height:1.5;white-space:pre-wrap;color:inherit;">${escapeHtml(c.content)}</div>
            </div>
          </div>

          <!-- Form Balas Komentar (Inline Drawer) -->
          <div id="reply-box-${c.id}" style="display:none;margin-left:48px;padding:12px;border-radius:8px;background:rgba(51,132,214,0.06);border:1px solid rgba(51,132,214,0.25);">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:#3384d6;font-weight:700;">
              <span><i class="fa fa-reply"></i> Membalas @${escapeHtml(c.username)}</span>
              <button type="button" onclick="toggleReplyBox('${c.id}')" style="background:none;border:none;color:var(--text-muted);font-size:11px;cursor:pointer;">✕ Batal</button>
            </div>
            ${!authUser ? `
              <div style="margin-bottom:8px;">
                <input type="text" id="reply-name-${c.id}" placeholder="Nama kamu (opsional, default: Penonton)" style="width:100%;box-sizing:border-box;padding:6px 10px;border-radius:6px;border:1px solid rgba(128,128,128,0.25);background:var(--bg-card,#fff);color:inherit;font-size:12px;outline:none;">
              </div>
            ` : ''}
            <textarea id="reply-textarea-${c.id}"
                      rows="2"
                      placeholder="Tulis balasan kamu..."
                      style="width:100%;box-sizing:border-box;padding:8px 10px;border-radius:6px;border:1px solid rgba(128,128,128,0.25);background:var(--bg-card,#fff);color:inherit;font-size:12px;outline:none;resize:vertical;"></textarea>
            
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap;gap:6px;">
              <div style="display:flex;align-items:center;gap:3px;flex-wrap:wrap;">
                ${['👍', '❤️', '🔥', '😂', '😭', '👏'].map(em => `<button type="button" onclick="insertEmoji('reply-textarea-${c.id}', '${em}')" style="background:none;border:none;font-size:15px;cursor:pointer;padding:2px 4px;">${em}</button>`).join('')}
                <button type="button" onclick="toggleEmojiModal('reply-textarea-${c.id}')" style="background:rgba(128,128,128,0.12);border:none;font-size:11px;font-weight:700;cursor:pointer;padding:3px 7px;border-radius:4px;color:inherit;">
                  😀
                </button>
              </div>
              <button type="button"
                      onclick="postComment('${c.id}')"
                      id="btn-submit-reply-${c.id}"
                      style="background:#3384d6;color:#fff;border:none;padding:6px 16px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;">
                <i class="fa fa-paper-plane"></i> Kirim Balasan
              </button>
            </div>
          </div>

          <!-- Daftar Balasan (Nested) -->
          ${childReplies.length ? `
            <div style="margin-left:48px;border-left:2px solid rgba(51,132,214,0.3);padding-left:12px;display:flex;flex-direction:column;gap:8px;margin-top:4px;">
              <div style="font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:2px;">
                💬 ${childReplies.length} Balasan
              </div>
              ${repliesHtml}
            </div>
          ` : ''}

        </div>
      `;
    }).join('');
  }

  async function postComment(parentId = null) {
    const isReply = parentId !== null;
    const textareaId = isReply ? `reply-textarea-${parentId}` : 'comment-textarea';
    const textarea = document.getElementById(textareaId);
    const btn = isReply ? document.getElementById(`btn-submit-reply-${parentId}`) : document.getElementById('btn-submit-comment');
    if (!textarea) return;

    const content = textarea.value.trim();
    if (!content) {
      alert(isReply ? 'Isi balasan tidak boleh kosong' : 'Isi komentar tidak boleh kosong');
      return;
    }

    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Mengirim...';
    }

    let customName = null;
    if (isReply) {
      const nameInput = document.getElementById(`reply-name-${parentId}`);
      if (nameInput) customName = nameInput.value.trim();
    }

    const payload = {
      slug,
      ep: epNum,
      content,
      parent_id: parentId ? parseInt(parentId) : null,
      user_id: (authUser && authUser.id) || Date.now(),
      username: (authUser && authUser.username) || customName || 'Penonton',
      user_role: (authUser && authUser.role) || 'user',
      avatar: (authUser && authUser.avatar) || `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent((authUser && authUser.username) || customName || 'Penonton')}`
    };

    let posted = false;
    try {
      const res = await fetch('/api/comments', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + (authToken || '')
        },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        const d = await res.json();
        if (d && d.status === 'success') posted = true;
      }
    } catch(err) {}

    if (!posted) {
      // Simpan di local storage hanya jika server offline/gagal
      const key = `comments_${slug}_${epNum}`;
      const list = JSON.parse(localStorage.getItem(key) || '[]');
      list.push({
        id: Date.now(),
        anime_slug: slug,
        ep: epNum,
        user_id: payload.user_id,
        username: payload.username,
        user_role: payload.user_role,
        avatar: payload.avatar,
        content: content,
        parent_id: parentId,
        created_at: new Date().toISOString().slice(0, 19).replace('T', ' ')
      });
      localStorage.setItem(key, JSON.stringify(list));
    }

    textarea.value = '';
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = isReply ? '<i class="fa fa-paper-plane"></i> Kirim Balasan' : '<i class="fa fa-paper-plane"></i> Kirim Komentar';
    }

    if (isReply) {
      const replyBox = document.getElementById(`reply-box-${parentId}`);
      if (replyBox) replyBox.style.display = 'none';
    }

    // Tutup emoji modal jika terbuka
    const modal = document.getElementById('emoji-picker-modal');
    if (modal) modal.style.display = 'none';

    loadComments();
  }

  window.deleteCommentItem = async function(cid) {
    if (!confirm('Hapus komentar ini? Semua balasan di dalamnya juga akan terhapus.')) return;
    try {
      await fetch('/api/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (authToken || '') },
        body: JSON.stringify({ action: 'delete', id: cid })
      });
    } catch(e) {}

    const key = `comments_${slug}_${epNum}`;
    let list = JSON.parse(localStorage.getItem(key) || '[]');
    list = list.filter(c => c.id !== cid && c.parent_id !== cid);
    localStorage.setItem(key, JSON.stringify(list));

    loadComments();
  };

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  renderCommentInput();
  loadComments();
});
</script>
</body>
</html>
