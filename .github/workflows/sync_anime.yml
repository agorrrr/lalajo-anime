name: Auto-Sync Samehadaku Anime

on:
  schedule:
    # Jalan otomatis setiap 1 jam
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'URL Anime spesifik (dari web mana saja: Samehadaku, Otakudesu, dll)'
        required: false
        default: ''
      pages:
        description: 'Jumlah halaman untuk di-scrape (1-57) jika url kosong'
        required: false
        default: '2'
      limit:
        description: 'Batas maksimal anime (kosongkan jika sesuai halaman)'
        required: false
        default: '30'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Jalankan Scraper
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.url }}" ]; then
              python scripts/scrape_samehadaku.py --url "${{ github.event.inputs.url }}"
            else
              python scripts/scrape_samehadaku.py --pages ${{ github.event.inputs.pages }} --limit ${{ github.event.inputs.limit }}
            fi
          else
            python scripts/scrape_samehadaku.py --hourly
          fi

      - name: Commit & Push jika ada update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/anime.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync anime data dari Samehadaku [skip ci]" && git push)
