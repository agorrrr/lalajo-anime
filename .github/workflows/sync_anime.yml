name: Auto-Sync Multi-Source Anime

on:
  schedule:
    # Jalan otomatis setiap 1 jam
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'URL Anime spesifik (dari web mana saja: Samehadaku, Anime-Indo, Sokuja, Oploverz, dll)'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Jalankan Multi-Source Scraper
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.url }}" ]; then
            python scripts/scrape_samehadaku.py --url "${{ github.event.inputs.url }}"
          else
            python scripts/scrape_samehadaku.py --hourly
          fi

      - name: Commit & Push jika ada update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/anime.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync multi-source anime (Samehadaku, Anime-Indo, Sokuja, Oploverz) [skip ci]" && git push)
